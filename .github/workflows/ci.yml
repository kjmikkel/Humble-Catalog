name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes its running CI obsolete, so that run is
# cancelled rather than left to finish (#110). The Windows leg alone takes
# minutes. Pushes to main are never cancelled: every commit there keeps
# its own complete run, which is what a later bisect or audit reads.
#
# main is grouped by commit, not by branch. A group holds at most one
# PENDING run even without cancel-in-progress -- a newer one replaces it --
# so a shared group would still drop the middle run of three quick merges.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Windows is the machine this is developed on; Linux is where the
    # portability assumptions actually get tested; macOS is the third
    # platform the README promises (#108). Running all three is what keeps
    # path handling and line endings honest.
    #
    # The newest Python runs on Linux only. requires-python is ">=3.12",
    # so a new interpreter has to be tested somewhere, and Linux is where
    # it is cheap: the Windows leg takes ~6 min against ~42 s on Linux
    # (measured in #104).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.13'
    # Named explicitly, because these names are main's required checks.
    # Left to the default, the python axis would rename every job to
    # "test (<os>, 3.12)" and every PR would wait for the old names
    # forever. The 3.12 jobs keep their names; only new jobs add one.
    name: test (${{ matrix.os }}${{ matrix.python != '3.12' && format(', py{0}', matrix.python) || '' }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          # leak_check_history.py needs every commit, not the default
          # depth-1 clone, or it would scan one commit and pass.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # No `playwright install`: the browser is only needed by `extract`
      # against the live site, which CI never does. The package still
      # imports, so nothing is skipped for its absence.
      - name: Install
        run: python -m pip install -e ".[dev]"

      # For the JS behaviour tests (tests/js_harness.py). They used to run
      # only because the runner images happened to ship Node, at whatever
      # version the image had; pinned here, the same major the suite is
      # developed against (#109).
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # HUMBLE_REQUIRE_NODE turns "no Node, skip the JS suite" into a
      # failure. Right on a contributor's machine, wrong here: a skip would
      # hide the loss of every JS test behind a skip count.
      - name: Tests
        env:
          HUMBLE_REQUIRE_NODE: '1'
        run: python -m pytest -q

      # This one is a real gate on a runner: it reads path names, so it
      # needs no catalog to tell whether a data file was ever committed.
      # The fetch-depth: 0 above is what lets it see history.
      - name: No data files tracked
        run: python scripts/check_no_data_tracked.py

      # Runners have no catalog.db and no reference spreadsheets, so this
      # reports SKIPPED and passes: it proves the gate still runs on a
      # fresh clone, not that the repo is clean. The term check that
      # means something runs locally, where the private data is.
      - name: Privacy check
        run: python scripts/leak_check.py
