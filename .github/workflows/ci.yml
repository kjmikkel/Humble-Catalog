name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is the machine this is developed on; Linux is where the
    # portability assumptions actually get tested; macOS is the third
    # platform the README promises (#108). Running all three is what keeps
    # path handling and line endings honest.
    #
    # The newest Python runs on Linux only. requires-python is ">=3.12",
    # so a new interpreter has to be tested somewhere, and Linux is where
    # it is cheap: the Windows leg takes ~6 min against ~42 s on Linux
    # (measured in #104).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.13'
    # Named explicitly, because these names are main's required checks.
    # Left to the default, the python axis would rename every job to
    # "test (<os>, 3.12)" and every PR would wait for the old names
    # forever. The 3.12 jobs keep their names; only new jobs add one.
    name: test (${{ matrix.os }}${{ matrix.python != '3.12' && format(', py{0}', matrix.python) || '' }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          # leak_check_history.py needs every commit, not the default
          # depth-1 clone, or it would scan one commit and pass.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # No `playwright install`: the browser is only needed by `extract`
      # against the live site, which CI never does. The package still
      # imports, so nothing is skipped for its absence.
      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      # This one is a real gate on a runner: it reads path names, so it
      # needs no catalog to tell whether a data file was ever committed.
      # The fetch-depth: 0 above is what lets it see history.
      - name: No data files tracked
        run: python scripts/check_no_data_tracked.py

      # Runners have no catalog.db and no reference spreadsheets, so this
      # reports SKIPPED and passes: it proves the gate still runs on a
      # fresh clone, not that the repo is clean. The term check that
      # means something runs locally, where the private data is.
      - name: Privacy check
        run: python scripts/leak_check.py

  # The viewer in a real browser, as a user installs it (#114). The test
  # job above never reaches a browser -- the JS harness stubs the DOM and
  # the webapp tests use Flask's test client -- so a script loaded in the
  # wrong order, a missing asset, or new JS against an old API could all
  # pass it. Linux only: what this catches does not vary by OS, and the
  # browser download is the slow part.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel

      # Non-editable, into a venv of its own: the code under test is the
      # wheel's copy, never the checkout's.
      - name: Install the wheel and a browser
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/smoke/bin/python" -m playwright install --with-deps chromium

      # Run from outside the checkout, and --require-installed refuses to
      # go on if humble_catalog resolves to the source tree anyway. The
      # demo catalog is invented data only.
      - name: Smoke-test the viewer
        working-directory: ${{ runner.temp }}
        run: >-
          "$RUNNER_TEMP/smoke/bin/python"
          "$GITHUB_WORKSPACE/scripts/smoke_viewer.py"
          --require-installed
          --screenshot "$RUNNER_TEMP/smoke-failure.png"

      # What the page looked like when it failed. The demo catalog is all
      # it can show, so this is safe to publish as an artifact.
      - name: Keep the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failure
          path: ${{ runner.temp }}/smoke-failure.png
          if-no-files-found: ignore
