<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Humble Catalog</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
<script>
  // Apply the saved theme before first paint so there is no flash of the
  // wrong palette. No saved value → attribute absent → the CSS media query
  // follows the OS setting.
  (() => { const t = localStorage.getItem("hc-theme");
           if (t) document.documentElement.dataset.theme = t; })();
</script>
</head>
<body>
<header>
  <h1>Humble Catalog
    <button id="theme-toggle" type="button" title="Toggle light/dark"
            aria-label="Toggle light/dark theme">☾</button></h1>
  <div id="run-banner" hidden></div>
  <div id="search-row">
    <label id="search-label" for="search">Search</label>
    <span id="search-wrap" class="ac-wrap"><input id="search" type="search" placeholder="Name..." autofocus></span>
  </div>
  <nav id="tabs" aria-label="Sections">
    <a id="tab-library" href="#/library">Library<span class="badge-count"></span></a>
    <a id="tab-maintenance" href="#/maintenance">Maintenance<span class="badge-count"></span></a>
    <a id="tab-keys" href="#/keys">Keys<span class="badge-count"></span></a>
    <a id="tab-bundles" href="#/bundles">Bundles<span class="badge-count"></span></a>
    <a id="tab-tasks" href="#/tasks">Tasks<span class="badge-count"></span></a>
  </nav>
</header>
<main>
  <section id="section-library" hidden>
  <div id="library-layout">
  <aside id="filters" aria-label="Filters">
  <div id="controls">
    <select id="f-type" aria-label="Filter by type"><option value="">All types</option>
      <option value="ebook">E-books</option><option value="audiobook">Audiobooks</option>
      <option value="comic">Comics</option><option value="music">Music/Soundtracks</option>
      <option value="android">Android apps</option></select>
    <select id="f-rating" aria-label="Filter by my rating">
      <option value="">Any rating</option>
      <option value="5">★5</option><option value="4">★4</option>
      <option value="3">★3</option><option value="2">★2</option>
      <option value="1">★1</option></select>
    <span class="chip-filter ac-wrap" data-field="genre"><input id="f-genre" aria-label="Filter by genre" placeholder="Genre..." size="14"></span>
    <span class="chip-filter ac-wrap" data-field="series"><input id="f-series" aria-label="Filter by series" placeholder="Series..." size="14"></span>
    <span class="chip-filter ac-wrap" data-field="authors"><input id="f-authors" aria-label="Filter by author" placeholder="Author..." size="16"></span>
    <span class="chip-filter ac-wrap" data-field="narrator"><input id="f-narrator" aria-label="Filter by narrator or artist" placeholder="Narrator/Artist..." size="16"></span>
    <span class="chip-filter ac-wrap" data-field="publisher"><input id="f-publisher" aria-label="Filter by publisher" placeholder="Publisher..." size="16"></span>
    <span class="chip-filter ac-wrap" data-field="bundle"><input id="f-bundle" aria-label="Filter by bundle" placeholder="Bundle..." size="18"></span>
    <span class="chip-filter ac-wrap" data-field="user_tags"><input id="f-user-tags" aria-label="Filter by my tags" placeholder="My tags..." size="14"></span>
    <span class="chip-filter ac-wrap" data-field="user_comment"><input id="f-notes" aria-label="Filter by notes" placeholder="Notes..." size="16"></span>
    <select id="f-flag" aria-label="Filter by flag"><option value="">No flag filter</option>
      <option value="multi">In multiple bundles</option>
      <option value="review">Needs review</option>
      <option value="matched">Matched</option>
      <option value="low_confidence">Low-confidence match</option>
      <option value="unmatched">Unmatched</option>
      <option value="pending">Pending enrichment</option>
      <option value="unrated">Unrated by me</option>
      <option value="nocover">No cover</option>
      <option value="nourl">No source URL</option>
      <option value="notes">Has notes</option>
      <option value="mytags">Has my tags</option>
      <option value="override">Queued for re-enrich</option></select>
    <span id="status-filter" aria-label="Filter by reading status">
      <button type="button" class="status-chip" data-status="want_to_read">Want to read</button>
      <button type="button" class="status-chip" data-status="unread">Unread</button>
      <button type="button" class="status-chip" data-status="reading">Reading</button>
      <button type="button" class="status-chip" data-status="read">Read</button>
      <button type="button" class="status-chip" data-status="dnf">DNF</button>
    </span>
  </div>
  </aside>
  <div id="library-main">
  <div id="table-toolbar">
    <button id="sidebar-toggle" type="button"
            aria-controls="filters" aria-expanded="true">Filters</button>
    <div id="filter-chips"></div>
    <span id="count"></span>
    <select id="export-format" aria-label="Export format">
      <option value="csv">CSV</option>
      <option value="xlsx">XLSX</option></select>
    <details id="column-picker">
      <summary id="column-picker-summary">Columns</summary>
      <div id="column-picker-panel">
        <div id="column-picker-body"></div>
        <button id="col-all" type="button">Select all</button>
        <button id="col-none" type="button">Select none</button>
      </div>
    </details>
    <button id="export" type="button">Download all</button>
  </div>
  <div id="bulk-bar">
    <label for="bulk-tag">Bulk</label>
    <span class="ac-wrap"><input id="bulk-tag" placeholder="tag..." size="16"></span>
    <button id="bulk-add">Add</button>
    <button id="bulk-remove">Remove</button>
    <button id="bulk-undo" hidden>Undo</button>
    <span id="bulk-note"></span>
  </div>
  <div id="stats-panel" hidden></div>
  <div id="table-wrap">
  <table id="catalog">
    <thead><tr>
      <th class="col-cover"></th><th data-sort="name"><button type="button" class="sort-btn">Name<span class="sort-ind"></span></button></th>
      <th data-sort="type"><button type="button" class="sort-btn">Type<span class="sort-ind"></span></button></th>
      <th data-sort="read_status"><button type="button" class="sort-btn">Status<span class="sort-ind"></span></button></th>
      <th data-sort="genre"><button type="button" class="sort-btn">Genre<span class="sort-ind"></span></button></th>
      <th data-sort="series"><button type="button" class="sort-btn">Series<span class="sort-ind"></span></button></th>
      <th data-sort="authors"><button type="button" class="sort-btn">Authors<span class="sort-ind"></span></button></th>
      <th data-sort="narrator"><button type="button" class="sort-btn">Narrator/<wbr>Artist<span class="sort-ind"></span></button></th>
      <th data-sort="publisher"><button type="button" class="sort-btn">Publisher<span class="sort-ind"></span></button></th>
      <th data-sort="bundle"><button type="button" class="sort-btn">Bundle<span class="sort-ind"></span></button></th>
      <th data-sort="external_rating"><button type="button" class="sort-btn">Rating<span class="sort-ind"></span></button></th>
      <th data-sort="my_rating"><button type="button" class="sort-btn">Mine<span class="sort-ind"></span></button></th>
      <th class="col-tags">My tags</th><th class="col-notes">Notes</th>
    </tr></thead>
    <!-- The first state, in the markup rather than written by a script:
         /api/items is awaited before anything is drawn, so this is what
         stands during the round trip. An empty <tbody> made a slow load,
         an empty catalog and a server that never answered all look the
         same. render() replaces it, with rows or with a reason. -->
    <tbody><tr class="table-empty"><td colspan="99">Loading the catalog…</td></tr></tbody>
  </table>
  </div>
  <!-- The table's spoken channel. Present from first paint and never
       removed: a live region inserted at the same moment as its text is
       not reliably announced, so the visible line in the table cannot be
       the region itself. render() writes the same sentence here, and
       writes it empty again once rows come back, or the region
       re-announces a stale one on the next change. -->
  <p id="table-status" class="visually-hidden" role="status"></p>
  <div id="card-list" hidden></div>
  <!-- The phone's editor. Below 600 px each row is a card and the table's
       controls are gone with the table; tapping a card opens this. Empty
       until then, and absent from the LAN viewer's reach because every
       control it draws is suppressed by READ_ONLY. -->
  <div id="sheet-scrim" hidden></div>
  <div id="edit-sheet" role="dialog" aria-modal="true"
       aria-labelledby="sheet-title" hidden></div>
  </div>
  </div>
  </section>
  <section id="section-maintenance" hidden>
    <div id="review-panel" hidden></div>
    <div id="dupes-panel" hidden></div>
  </section>
  <section id="section-keys" hidden>
    <label for="keys-search">Search keys</label>
    <input id="keys-search" type="search" placeholder="Title or store...">
    <div id="keys-panel"></div>
  </section>
  <section id="section-bundles" hidden>
    <p id="bundle-empty" class="section-empty">Paste a Humble bundle URL to compare each tier's
      owned and new items with your catalog. To preview this month's Choice,
      use the Choice button below; no URL is needed.</p>
    <div id="bundle-form">
      <input id="bundle-url" aria-label="Humble bundle URL to preview" type="url" size="60"
             placeholder="Paste a HumbleBundle page URL to see what you already own">
      <button id="bundle-go">Check bundle</button>
    </div>
    <div id="bundle-panel" hidden></div>
    <div id="choice-form">
      <button id="choice-go">Check this month's Choice</button>
    </div>
    <div id="choice-panel" hidden></div>
  </section>

  <section id="section-tasks" hidden>
    <div id="job-panel" hidden></div>
    <div id="task-message" role="status"></div>
    <div id="task-cards"></div>
  </section>
  <div id="handoff-screen" hidden role="alertdialog" aria-live="assertive"></div>
</main>
<script src="/static/autocomplete.js"></script>
<script src="/static/fuzzy.js"></script>
<script src="/static/app.js"></script>
<script src="/static/catalog.js"></script>
<script src="/static/stats.js"></script>
<script src="/static/maintenance.js"></script>
<script src="/static/keys.js"></script>
<script src="/static/bundles.js"></script>
<script src="/static/tasks.js"></script>
<script src="/static/shell.js"></script>
</body>
</html>
